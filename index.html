<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pillow: verified homes in Lagos and Abuja</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5FAF6;--surf:#FFFFFF;--ink:#10241A;--mute:#52665A;--line:#DCE8DF;--teal:#1E7B4A;--yel:#1E7B4A;--yelink:#FFFFFF;--ok:#1E7B4A;--bad:#B3402A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A13;--surf:#14271D;--ink:#EAF4EE;--mute:#9BB5A5;--line:#25402F;--teal:#5FD08E;--yel:#3FBF78;--yelink:#07140D;--ok:#5FD08E;--bad:#F08A72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1A13;--surf:#14271D;--ink:#EAF4EE;--mute:#9BB5A5;--line:#25402F;--teal:#5FD08E;--yel:#3FBF78;--yelink:#07140D;--ok:#5FD08E;--bad:#F08A72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.1;margin:0}
a{color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surf);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:18px}
.logo{font:800 24px 'Bricolage Grotesque',sans-serif;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;background:var(--yel);border-radius:4px;box-shadow:inset 0 -7px 0 var(--yelink)}
nav{display:flex;gap:16px;margin-left:auto;align-items:center}
nav a{text-decoration:none;font-weight:500}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:11px 18px;font:700 15px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.y{background:var(--yel);color:var(--yelink)}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
main{max-width:1080px;margin:auto;padding:0 18px 56px}
.hero{padding:44px 0 28px}
.hero h1{font-size:clamp(34px,7vw,60px);font-weight:800;max-width:15em}
.hero p{color:var(--mute);max-width:34em;font-size:18px;margin:14px 0 24px}
.search{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px 'DM Sans',sans-serif}
.checks{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:30px 0 10px}
.checks div{border-left:4px solid var(--yel);padding:2px 0 2px 14px}
.checks b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:19px}
.checks span{color:var(--mute);font-size:15px}
h2{font-size:28px;margin:34px 0 14px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;display:block}
.ph{height:130px;display:flex;align-items:flex-end;padding:12px;font:800 26px 'Bricolage Grotesque',sans-serif;color:#fff;position:relative}
.ph.big{height:220px;font-size:40px;border-radius:12px}
.stamp{position:absolute;top:10px;right:10px;background:var(--yel);color:var(--yelink);font:700 13px 'DM Sans',sans-serif;padding:4px 9px;border-radius:4px;border:2px solid var(--yelink)}
.card .in{padding:12px 14px 14px}
.price{font:800 22px 'Bricolage Grotesque',sans-serif}
.price small{font:400 14px 'DM Sans',sans-serif;color:var(--mute)}
.meta{color:var(--mute);font-size:15px}
.tog{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.tog button{border:0;background:transparent;color:var(--ink);padding:10px 18px;font:700 15px 'DM Sans',sans-serif;cursor:pointer}
.tog button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.two{display:grid;gap:26px;grid-template-columns:1fr;margin-top:18px}
@media(min-width:860px){.two{grid-template-columns:1.5fr 1fr}}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{font-size:20px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0;font-weight:700}
.sc{margin:11px 0}
.sc .t{display:flex;justify-content:space-between;font-size:15px}
.trk{height:9px;background:var(--line);border-radius:5px;margin-top:4px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--teal)}
.ok{color:var(--ok);font-weight:700}.wait{color:var(--bad);font-weight:700}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.note{color:var(--mute);font-size:14px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:8px;font-size:15px;display:none;z-index:20;max-width:90vw}
.empty{padding:30px;text-align:center;color:var(--mute)}
textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px 'DM Sans',sans-serif;resize:vertical}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.drop{display:block;border:2px dashed var(--teal);border-radius:12px;padding:28px 16px;text-align:center;background:var(--bg);cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.thumbs div{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;bottom:4px;right:4px;border:0;border-radius:6px;background:var(--ink);color:var(--bg);padding:3px 8px;cursor:pointer;font-size:13px}
.thumbs .cv{position:absolute;top:4px;left:4px;background:var(--yel);color:var(--yelink);font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px}
.bar{flex-wrap:wrap;row-gap:8px}
.authbox{max-width:420px;margin:36px auto 0;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:16px 0}
.stats div{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--mute)}
.stats b{display:block;font:800 28px 'Bricolage Grotesque',sans-serif;color:var(--ink)}
.lr{display:grid;gap:10px;grid-template-columns:1fr;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
@media(min-width:760px){.lr{grid-template-columns:1.6fr 1fr auto;align-items:center}}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;border:1.5px solid currentColor;color:var(--mute)}
.badge.live{color:var(--ok)}.badge.changes{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.s{padding:8px 12px;font-size:14px}
.av{width:56px;height:56px;border-radius:50%;background:var(--yel);color:var(--yelink);display:flex;align-items:center;justify-content:center;font:800 20px 'Bricolage Grotesque',sans-serif;flex:none}
.av.big{width:84px;height:84px;font-size:30px}
.acard{display:flex;gap:14px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none}
.ahead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:8px}
.rev{border-bottom:1px solid var(--line);padding:12px 0}.rev:last-child{border:0}
.cb{display:flex;gap:10px;align-items:flex-start;margin:7px 0;color:var(--ink);font-size:15px}
.cb input{width:20px;height:20px;padding:0;margin:2px 0 0;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts select{min-width:200px}
@media(min-width:760px){.lr.adm{grid-template-columns:1.2fr 1.4fr auto;align-items:start}}
@media(prefers-reduced-motion:no-preference){.hero h1{animation:up .5s ease-out}@keyframes up{from{opacity:0;transform:translateY(10px)}}}
.ph{text-shadow:0 1px 6px rgba(0,0,0,.55)}
nav a[href="#/agents"]{display:none}
</style>
</head>
<body>

<a class="logo" href="#/"><i></i>Pillow</a>
<nav><a href="#/search?mode=rent">Rent</a><a href="#/search?mode=sale">Buy</a><a href="#/agents">Agents</a><a href="#/signin" id="acct">Sign in</a><button class="btn y" id="listBtn">List a property</button></nav>

<div id="toast" role="status"></div>
<script>
var L=[
{id:1,mode:'rent',city:'Lagos',area:'Yaba',t:'2 bedroom flat',p:3500000,bed:2,bath:2,c:'#1E7B4A',s:[16,3,2,4,35]},
{id:2,mode:'rent',city:'Lagos',area:'Lekki Phase 1',t:'3 bedroom apartment',p:9000000,bed:3,bath:3,c:'#2F8F5B',s:[20,4,3,4,50]},
{id:3,mode:'rent',city:'Lagos',area:'Ikeja GRA',t:'3 bedroom flat',p:6000000,bed:3,bath:3,c:'#176B45',s:[18,4,4,5,40]},

{id:5,mode:'rent',city:'Abuja',area:'Wuse 2',t:'2 bedroom flat',p:5000000,bed:2,bath:2,c:'#14603B',s:[18,4,4,4,20]},
{id:6,mode:'rent',city:'Abuja',area:'Gwarinpa',t:'3 bedroom flat',p:4500000,bed:3,bath:3,c:'#2A7A55',s:[14,3,4,3,45]},
{id:7,mode:'sale',city:'Abuja',area:'Jabi',t:'3 bedroom terrace',p:120000000,bed:3,bath:4,c:'#3F8A5F',s:[20,4,4,4,25],d:['ok','ok','wait']},
{id:8,mode:'sale',city:'Abuja',area:'Gwarinpa',t:'4 bedroom detached house',p:95000000,bed:4,bath:4,c:'#1F6B50',s:[14,3,4,3,45],d:['ok','wait','ok']}];
var N=function(n){return '\u20A6'+n.toLocaleString('en-NG')};
var app=document.getElementById('app');

document.getElementById('listBtn').onclick=function(){location.hash='#/list'};

'<div class="checks"><div><b>Landlord and documents checked</b><span>We confirm who owns it and what papers exist.</span></div><div><b>Full move-in cost shown</b><span>Rent, agent fee, legal fee and caution deposit in one total.</span></div><div><b>Area scores from real data</b><span>Power hours, water, flood safety, security and rush-hour commute.</span></div></div>'+

function form(m,c,b,mx){return '<div class="search"><div><label>I want to</label><select id="fm"><option value="rent"'+(m=='rent'?' selected':'')+'>Rent</option><option value="sale"'+(m=='sale'?' selected':'')+'>Buy</option></select></div><div><label>City</label><select id="fc"><option value="">Lagos and Abuja</option><option'+(c=='Lagos'?' selected':'')+'>Lagos</option><option'+(c=='Abuja'?' selected':'')+'>Abuja</option></select></div><div><label>Bedrooms</label><select id="fb"><option value="0">Any</option><option value="2"'+(b==2?' selected':'')+'>2 or more</option><option value="3"'+(b==3?' selected':'')+'>3 or more</option><option value="4"'+(b==4?' selected':'')+'>4 or more</option></select></div><div><label>Max price (\u20A6)</label><input id="fx" type="number" inputmode="numeric" placeholder="No limit" value="'+(mx||'')+'"></div><button class="btn y" id="fgo">Search homes</button></div>'}
function bindForm(){document.getElementById('fgo').onclick=function(){location.hash='#/search?mode='+fm.value+'&city='+fc.value+'&bed='+fb.value+'&max='+fx.value}}
function params(){var o={},q=(location.hash.split('?')[1]||'').split('&');q.forEach(function(p){var k=p.split('=');if(k[0])o[k[0]]=decodeURIComponent(k[1]||'')});return o}
function search(){
var o=params(),m=o.mode||'rent',r=L.filter(function(x){return x.mode==m&&(!o.city||x.city==o.city)&&x.bed>=(+o.bed||0)&&(!o.max||x.p<=+o.max)});
app.innerHTML='<h2>'+(m=='rent'?'Homes to rent':'Homes for sale')+(o.city?' in '+o.city:' in Lagos and Abuja')+'</h2>'+form(m,o.city,+o.bed,o.max)+'<p class="meta">'+r.length+' verified '+(r.length==1?'home':'homes')+'</p>'+(r.length?'<div class="grid">'+r.map(card).join('')+'</div>':'<div class="empty">No homes match. Raise the price limit or choose both cities.</div>');
bindForm()}
var SN=['Power supply','Water supply','Flood safety','Security'];
function detail(id){
var x=L.filter(function(y){return y.id==id})[0];if(!x){location.hash='#/';return}
var s=x.s,rent=x.mode=='rent',side;
if(rent){var a=x.p*.1;side='<h3>Move-in cost</h3><div class="row"><span>First year rent</span><span>'+N(x.p)+'</span></div><div class="row"><span>Agent fee</span><span>'+N(a)+'</span></div><div class="row"><span>Legal fee</span><span>'+N(a)+'</span></div><div class="row"><span>Caution deposit</span><span>'+N(a)+'</span></div><div class="row"><span>Total to pay</span><span>'+N(x.p+a*3)+'</span></div><p class="note">Sample fees at 10% each. Real fees are confirmed per listing.</p>'}
else{var D=['Certificate of Occupancy','Governor\u2019s consent','Survey plan'];side='<h3>Document checks</h3>'+D.map(function(n,i){return '<div class="row"><span>'+n+'</span><span class="'+x.d[i]+'">'+(x.d[i]=='ok'?'Verified':'In review')+'</span></div>'}).join('')+'<p class="note">We do not mark a sale as fully verified until all three are confirmed.</p>'}
var sc=SN.map(function(n,i){var v=i==0?s[0]/24:s[i]/5,l=i==0?s[0]+' hours a day':s[i]+' out of 5';return '<div class="sc"><div class="t"><span>'+n+'</span><span>'+l+'</span></div><div class="trk"><i style="width:'+Math.round(v*100)+'%"></i></div></div>'}).join('');
app.innerHTML='<p><a href="#/search?mode='+x.mode+'">Back to results</a></p><div class="ph big" style="background:'+x.c+'">'+x.area+'<span class="stamp">Verified</span></div><div class="two"><div><h1 style="font-size:34px;margin-top:6px">'+x.t+'</h1><p class="meta">'+x.area+', '+x.city+'. '+x.bed+' bed, '+x.bath+' bath.</p><div class="price" style="font-size:30px">'+N(x.p)+(rent?' <small>per year</small>':'')+'</div>'+
'<div class="panel" style="margin-top:18px"><h3>How the area lives</h3>'+sc+'<div class="sc"><div class="t"><span>Commute at rush hour</span><span>'+s[4]+' minutes to the city centre</span></div></div></div></div>'+
'<div><div class="panel">'+side+'</div><div class="panel" style="margin-top:16px"><h3>Listed by</h3><a href="#/agent/'+ag(x).id+'"><b>'+ag(x).name+'</b></a><div class="meta">'+ag(x).rt+' from '+ag(x).rv+' reviews. Verified agent in '+ag(x).city+'.</div></div><div class="panel" style="margin-top:16px"><h3>Next step</h3><a class="btn y" style="display:block;text-align:center" href="https://wa.me/2340000000000?text='+encodeURIComponent('Hi, I am interested in the '+x.t+' in '+x.area)+'">Chat on WhatsApp</a><button class="btn o" id="bk" style="width:100%;margin-top:10px">Book an inspection</button><div id="bm"></div></div></div></div>';
document.getElementById('bk').onclick=function(){document.getElementById('bm').innerHTML='<div class="msg"><label for="bd">Pick a day</label><input id="bd" type="date"><button class="btn" id="bc" style="margin-top:10px;width:100%">Confirm inspection</button></div>';document.getElementById('bc').onclick=function(){var d=document.getElementById('bd').value;if(!d){toast('Choose a day first.');return}document.getElementById('bm').innerHTML='<div class="msg ok">Inspection requested for '+d+'. The agent will confirm on WhatsApp.</div>'}}}
var PH=[];
function listForm(){
if(!USER){NEXT='#/list';location.hash='#/signin';return}
PH=[];var $=function(i){return document.getElementById(i)};
app.innerHTML='<p><a href="#/">Back to home</a></p><h2 style="margin-top:10px">List a property</h2><p class="meta">Tell us about the property. Our team inspects it before it goes live with the Verified stamp.</p><div class="panel" style="margin-top:14px"><h3>Property details</h3><div class="fgrid"><div><label for="lm">Listing type</label><select id="lm"><option value="rent">For rent</option><option value="sale">For sale</option></select></div><div><label for="lc">City</label><select id="lc"><option>Lagos</option><option>Abuja</option></select></div><div><label for="la">Area</label><input id="la" placeholder="For example, Lekki Phase 1"></div><div><label for="lt">Title</label><input id="lt" placeholder="3 bedroom flat"></div><div><label for="lp" id="lpl">Rent per year (\u20A6)</label><input id="lp" type="number" inputmode="numeric"></div><div><label for="lb">Bedrooms</label><input id="lb" type="number" min="0" inputmode="numeric"></div><div><label for="lh">Bathrooms</label><input id="lh" type="number" min="0" inputmode="numeric"></div></div><div style="margin-top:14px"><label for="ld">Description</label><textarea id="ld" rows="4" placeholder="Power supply, water source, security, nearby roads and landmarks"></textarea></div></div>'+
'<div class="panel" style="margin-top:16px"><h3>Owner contact</h3><div class="fgrid"><div><label for="ln">Full name</label><input id="ln"></div><div><label for="lw">WhatsApp number</label><input id="lw" type="tel" placeholder="0803 000 0000"></div></div></div>'+
'<div class="panel" style="margin-top:16px"><h3>Property photos</h3><p class="meta" style="margin:0 0 12px">Add clear photos of every room and the outside. Up to 15 photos, and the first one is the cover.</p><label class="drop" for="lf" id="dz" tabindex="0"><b>Choose photos</b><br><span class="meta">JPG or PNG, up to 5 MB each. At least 3 photos.</span></label><input id="lf" type="file" accept="image/*" multiple hidden><div class="thumbs" id="th"></div></div>'+
'<div style="margin-top:18px"><button class="btn y" id="ls">Submit for verification</button></div><div id="lr"></div>';
var show=function(c,t){var m=document.createElement('div');m.className='msg '+c;m.textContent=t;$('lr').innerHTML='';$('lr').appendChild(m)};
var draw=function(){$('th').innerHTML=PH.map(function(s,i){return '<div><img src="'+s+'" alt="Property photo '+(i+1)+'">'+(i==0?'<span class="cv">Cover</span>':'')+'<button data-i="'+i+'" aria-label="Remove photo '+(i+1)+'">Remove</button></div>'}).join('')};
$('lm').onchange=function(){$('lpl').textContent=($('lm').value=='rent'?'Rent per year':'Sale price')+' (\u20A6)'};
$('dz').onkeydown=function(e){if(e.key=='Enter'||e.key==' '){e.preventDefault();$('lf').click()}};
$('lf').onchange=function(){var bad=0;Array.prototype.slice.call($('lf').files).forEach(function(f){if(PH.length>=15||f.size>5242880||f.type.indexOf('image/')!=0){bad++;return}var r=new FileReader();r.onload=function(){if(PH.length<15){PH.push(r.result);draw()}};r.readAsDataURL(f)});if(bad)toast(bad+' file(s) skipped. Photos must be images under 5 MB, 15 at most.');$('lf').value=''};
$('th').onclick=function(e){var i=e.target.getAttribute('data-i');if(i!==null){PH.splice(+i,1);draw()}};

 g('ls').onclick=async function(){
  var miss=['la','lt','lp','lb','ln','lw'].filter(function(k){return !g(k).value.trim()});
  if(miss.length){g(miss[0]).focus();m('wait','Complete the area, title, price, bedrooms, owner name and WhatsApp number.');return}
  var ph=g('lw').value.replace(/\s/g,'');
  if(ph.length<10||ph.length>16){g('lw').focus();m('wait','Enter a valid WhatsApp number.');return}
  if(FILES.length<3){m('wait','Add at least 3 photos so renters and buyers can see the property.');return}
  var b=g('ls');b.disabled=true;b.textContent='Submitting';
  try{
   var pr=await sb.from('profiles').update({full_name:g('ln').value.trim(),phone:ph}).eq('id',USER.id);if(pr.error)throw pr.error;
   var r=await sb.from('listings').insert({owner_id:USER.id,mode:g('lm').value,city:g('lc').value,area:g('la').value.trim(),title:g('lt').value.trim(),description:g('ld').value.trim()||null,price_ngn:Math.round(+g('lp').value),bedrooms:+g('lb').value,bathrooms:g('lh').value?+g('lh').value:null,status:'pending'}).select('id').single();
   if(r.error)throw r.error;
   var rows=[];
   for(var i=0;i<FILES.length;i++){var f=FILES[i].f,path=USER.id+'/'+r.data.id+'/'+i+'-'+Date.now()+'.'+(f.type.split('/')[1]||'jpg').replace('jpeg','jpg');var u=await sb.storage.from('listing-photos').upload(path,f,{contentType:f.type});if(u.error)throw u.error;rows.push({listing_id:r.data.id,storage_path:path,position:i})}
   var pp=await sb.from('listing_photos').insert(rows);if(pp.error)throw pp.error;
   m('ok','Submitted. Your listing is in review. Our team will inspect it and confirm on WhatsApp before it goes live.');
   var a=document.createElement('a');a.href='#/dashboard';a.className='btn o s';a.textContent='Go to my listings';a.style.marginTop='10px';g('lr').appendChild(a);
  }catch(e){m('wait',(e&&e.message)||'Could not submit. Try again.')}
  b.disabled=false;b.textContent='Submit for verification';
 };
};

/* owner dashboard */
var _dash=dash;
dash=async function(){
 if(!USER){NEXT='#/dashboard';location.hash='#/signin';return}
 var r=await sb.from('listings').select('*,listing_photos(count),inquiries(count)').eq('owner_id',USER.id).order('created_at',{ascending:false});
 if(r.error){ero(r.error);return}
 OWN=r.data.map(function(x){return {id:x.id,t:x.title,area:x.area,city:x.city,p:x.price_ngn,mode:x.mode,ph:(one(x.listing_photos)||{}).count||0,st:ST[x.status],inq:(one(x.inquiries)||{}).count||0,note:x.review_note||''}});
 _dash();
 g('so').onclick=async function(){await sb.auth.signOut();USER=null;location.hash='#/';toast('You have signed out.')};
 g('ll').onclick=async function(e){
  var b=e.target,a=b.getAttribute('data-a');if(!a)return;var id=b.getAttribute('data-id');
  if(a=='edit'){toast('Editing is coming soon.');return}
  if(a=='close'){var u=await sb.from('listings').update({status:'closed'}).eq('id',id);if(u.error){ero(u.error);return}dash();return}
  if(b.getAttribute('data-armed')){var d=await sb.from('listings').delete().eq('id',id);if(d.error){ero(d.error);return}dash()}
  else{b.setAttribute('data-armed','1');b.textContent='Tap again to remove'}
 };
};

/* admin */
var _admin=admin;
admin=async function(){
 if(!USER||USER.role!='admin'){app.innerHTML='<div class="empty" style="margin-top:30px">This page is for the Pillow team. Sign in with an admin account.</div>';return}
 AT='l';
 var r=await sb.from('listings').select('*,owner:profiles!listings_owner_id_fkey(full_name),listing_photos(count),listing_checks(*)').neq('status','closed').order('created_at',{ascending:false});
 if(r.error){ero(r.error);return}
 ML=r.data.map(function(x){var c=one(x.listing_checks)||{};return {id:x.id,t:esc(x.title),area:esc(x.area),city:x.city,p:x.price_ngn,mode:x.mode,owner:esc((one(x.owner)||{}).full_name||'Owner'),ph:(one(x.listing_photos)||{}).count||0,st:x.status=='pending'?'pending':x.status=='verified'?'verified':'rejected',note:esc(x.review_note||''),rj:RJ===x.id,ck:[!!c.owner_id_confirmed,!!c.property_visited,!!c.photos_match,!!c.documents_checked]}});
 _admin();
 g('tg').remove();
 var intro=document.querySelector('#app > p.meta');if(intro)intro.textContent='Tick each check you completed, then approve.';
 var find=function(id){return ML.filter(function(x){return String(x.id)==id})[0]};
 g('am').onchange=async function(e){
  var t=e.target;if(t.type!='checkbox')return;var x=find(t.getAttribute('data-id')),i=+t.getAttribute('data-i');if(!x)return;
  x.ck[i]=t.checked;
  var u=await sb.from('listing_checks').upsert({listing_id:x.id,owner_id_confirmed:x.ck[0],property_visited:x.ck[1],photos_match:x.ck[2],documents_checked:!!x.ck[3],checked_by:USER.id});
  if(u.error){ero(u.error);t.checked=!t.checked;x.ck[i]=t.checked;return}
  var need=x.mode=='sale'?4:3,ok=true;for(var k=0;k<need;k++)if(!x.ck[k])ok=false;
  var b=t.closest('.lr').querySelector('[data-a=ok]');if(b)b.disabled=!ok;
 };
 g('am').onclick=async function(e){
  var b=e.target,a=b.getAttribute('data-a');if(!a)return;var x=find(b.getAttribute('data-id'));if(!x)return;
  var set=async function(o){var u=await sb.from('listings').update(o).eq('id',x.id);if(u.error){ero(u.error);return false}return true};
  if(a=='ok'){if(await set({status:'verified',review_note:null})){toast('Approved. The listing is live on the site.');admin()}}
  else if(a=='no'){RJ=x.id;admin()}
  else if(a=='cancel'){RJ=null;admin()}
  else if(a=='rj'){var why=b.closest('.lr').querySelector('select').value;if(await set({status:'changes_requested',review_note:why})){RJ=null;admin()}}
  else if(a=='undo'){if(await set({status:'pending',review_note:null}))admin()}
 };
};

/* routing and start up */
var _route=route;
removeEventListener('hashchange',_route);
route=async function(){
 var h=location.hash||'#/';
 if(h=='#/'||h.indexOf('#/search')==0||h.indexOf('#/listing/')==0||h.indexOf('#/agent')==0)await loadPublic();
 _route();
};
addEventListener('hashchange',route);
sb.auth.onAuthStateChange(function(ev){if(ev=='SIGNED_OUT'){USER=null;setTimeout(route,0)}});
(async function(){
 try{var s=await sb.auth.getSession();await setUser(s.data.session)}catch(e){}
 route();
})();

</script>
